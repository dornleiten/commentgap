[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commentgap-scraper"
version = "0.4.0"
description = "Resumable, privacy-preserving Der Standard forum scraper"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=18",
]

[project.scripts]
commentgap-scrape = "commentgap_scraper.cli:main"
commentgap-embed = "commentgap_analysis.embedding_cli:main"
commentgap-similarity = "commentgap_analysis.similarity_cli:main"
commentgap-features = "commentgap_analysis.feature_cli:main"
commentgap-aqua = "commentgap_analysis.aqua_cli:main"
commentgap-aqua-parity = "commentgap_analysis.aqua_parity:main"
commentgap-aqua-promote = "commentgap_analysis.aqua_promotion:main"

[tool.setuptools.packages.find]
include = ["commentgap_scraper*", "commentgap_analysis*", "aqua_runtime*"]

[tool.setuptools.package-data]
aqua_runtime = ["artifacts.json"]

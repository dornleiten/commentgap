[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commentgap-scraper"
version = "0.3.2"
description = "Resumable, privacy-preserving Der Standard forum scraper"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=18",
]

[project.scripts]
commentgap-scrape = "commentgap_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["commentgap_scraper*"]
